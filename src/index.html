<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>調査システム</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./css/common.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/home.css" />
  <link rel="stylesheet" href="./css/pwa-offline.css" />
</head>
<body>
  <section id="shirabeHome" class="shirabe-home">
    <div class="shirabe-home-shell">
      <header class="shirabe-home-header">
        <div class="shirabe-home-brand-block">
          <h1 class="shirabe-home-title">案件を選択</h1>
          <p>調査を始める案件、または利用する機能を選択します。</p>
        </div>
        <div class="shirabe-home-meta">
          <div class="shirabe-meta-item">
            <span class="shirabe-meta-label">端末</span>
            <strong id="homeDeviceName"></strong>
          </div>
          <div class="shirabe-meta-item shirabe-meta-account">
            <span class="shirabe-meta-label">Microsoft</span>
            <strong id="homeMicrosoftName">未接続</strong>
            <button type="button" class="shirabe-link-button" id="homeReconnectMicrosoftButton">接続</button>
          </div>
          <div class="shirabe-meta-item">
            <span class="shirabe-meta-label">アプリ</span>
            <button type="button" class="shirabe-link-button" id="showUpdatePromptButton">バージョン確認</button>
          </div>
        </div>
      </header>

      <div class="shirabe-home-statusbar">
        <div class="shirabe-service-status" id="homeFirestoreStatus" title="">
          <span class="shirabe-status-dot" aria-hidden="true"></span>
          <b>Firestore</b>
          <span id="homeFirestoreState">確認中</span>
        </div>
        <div class="shirabe-service-status" id="homeOneDriveStatus" title="">
          <span class="shirabe-status-dot" aria-hidden="true"></span>
          <b>OneDrive</b>
          <span id="homeOneDriveState">確認中</span>
        </div>
        <div class="shirabe-home-note" id="homeConnectionNote"></div>
      </div>

      <main class="shirabe-home-main">
        <section class="shirabe-home-section shirabe-device-projects">
          <div class="shirabe-section-heading">
            <div>
              <span class="shirabe-section-kicker">この端末</span>
              <h2>最近の案件</h2>
            </div>
          </div>
          <div class="shirabe-local-project-list" id="homeLocalProjectList"></div>
        </section>

        <aside class="shirabe-home-section shirabe-start-section">
          <div class="shirabe-section-heading">
            <div>
              <span class="shirabe-section-kicker">操作</span>
              <h2>案件を開く</h2>
            </div>
          </div>
          <div class="shirabe-primary-actions">
            <button type="button" class="shirabe-action-card primary" id="homeNewProjectButton">
              <span class="shirabe-action-symbol">＋</span>
              <span><strong>新規作成</strong><small>仮案件を作成して調査を開始</small></span>
            </button>
            <button type="button" class="shirabe-action-card" id="homeOpenExistingButton" disabled>
              <span class="shirabe-action-symbol">↗</span>
              <span><strong>既存案件を開く</strong><small>Firestore / OneDriveから選択</small></span>
            </button>
          </div>
          <div class="shirabe-home-secondary">
            <button type="button" class="shirabe-sample-button" id="homeOpenSampleButton">サンプル案件を開く</button>
          </div>
        </aside>
      </main>
    </div>
  </section>

  <div class="shared-project-modal" id="newProjectModal" data-modal-close data-modal-target="newProjectModal">
    <div class="shared-project-card new-project-card" data-modal-stop>
      <div class="shared-project-head">
        <b>新規作成</b>
        <button class="btn small" type="button" data-modal-close data-modal-target="newProjectModal">閉じる</button>
      </div>
      <div class="new-project-form">
        <label><span>案件名</span><input id="newProjectNameInput" autocomplete="off" placeholder="案件名を入力" /></label>
        <label><span>住所</span><input id="newProjectAddressInput" autocomplete="off" placeholder="住所を入力" /></label>
        <div class="hint">案件番号は作成時に yymmdd-連番 で自動発番します。</div>
        <div class="project-restore-status" id="newProjectStatus"></div>
      </div>
      <div class="new-project-actions">
        <button class="btn" type="button" data-modal-close data-modal-target="newProjectModal">キャンセル</button>
        <button class="btn primary" type="button" id="createNewProjectButton">作成して開く</button>
      </div>
    </div>
  </div>

  <div class="shared-project-modal" id="sharedProjectModal" data-modal-close data-modal-target="sharedProjectModal">
    <div class="shared-project-card" data-modal-stop></div>
  </div>

  <div class="update-modal" id="updateModal" data-update-modal-close>
    <div class="update-card" data-modal-stop>
      <h3>アップデート</h3>
      <div class="hint" id="updateMessage">最新バージョンを確認します。</div>
      <div class="update-actions">
        <button type="button" class="btn" id="closeAppUpdateButton" data-update-modal-close>閉じる</button>
        <button type="button" class="btn primary" id="confirmAppUpdateButton" hidden>アップデート</button>
      </div>
    </div>
  </div>

  <script type="module" src="./js/home/home-init.js"></script>
</body>
</html>
