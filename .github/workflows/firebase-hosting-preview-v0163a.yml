name: Deploy v0.1.7.6 Preview

on:
  push:
    branches:
      - work/v0.1.7.6-20260916
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-preview-v0176
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src/js src/config -type f -name '*.js' -print0)
          node --check src/service-worker.js

      - name: Module and app shell reference checks
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const roots = ['src/js', 'src/config'];
          const files = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes:true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile() && entry.name.endsWith('.js')) files.push(full);
            }
          }
          roots.forEach(walk);
          const missing = [];
          const re = /(?:from\s*|import\s*\()\s*['"](\.[^'"]+)['"]/g;
          for (const file of files) {
            const text = fs.readFileSync(file, 'utf8');
            let match;
            while ((match = re.exec(text))) {
              const resolved = path.resolve(path.dirname(file), match[1]);
              const candidates = [resolved, `${resolved}.js`, path.join(resolved, 'index.js')];
              if (!candidates.some((candidate) => fs.existsSync(candidate))) missing.push(`${file} -> ${match[1]}`);
            }
          }
          if (missing.length) {
            console.error('Missing relative module references:\n' + missing.join('\n'));
            process.exit(1);
          }

          const sw = fs.readFileSync('src/service-worker.js', 'utf8');
          const shell = [...sw.matchAll(/['"]\.\/([^'"]+)['"]/g)].map((m) => m[1]);
          const missingShell = shell.filter((rel) => rel && !fs.existsSync(path.join('src', rel)));
          if (missingShell.length) {
            console.error('Missing APP_SHELL files:\n' + missingShell.join('\n'));
            process.exit(1);
          }
          NODE

      - name: v0.1.7.6 r8 consistency checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q "version: '0.1.7.6'" src/config/app-config.js
          grep -q "revision: 'r8'" src/config/app-config.js
          grep -q '"version": "0.1.7.6"' src/version.json
          grep -q '"revision": "r8"' src/version.json
          grep -q "chousa-app-v0.1.7.6-r8" src/service-worker.js

          test -f src/js/output/output-pdf-preview.js
          test -f src/js/output/output-format.js
          test -f src/js/output/output-targets.js
          grep -q "OutputPdfPreview" src/js/output/output-controller.js
          grep -q "formatSamplingCode" src/js/output/output-pdf-renderer.js
          grep -q "formatSamplingCode" src/js/output/output-export-controller.js
          grep -q "MATERIAL_WIDTHS.*6,33,12,42,6,19,19,53" src/js/output/output-pdf-renderer.js
          grep -q "ROOM_WIDTHS.*10,12,22,12,6,38,35,6,19,30" src/js/output/output-pdf-renderer.js

          if grep -R "output-report-renderer\|output-photo-layout" -n src; then
            echo "obsolete HTML output path remains"
            exit 1
          fi
          if test -e src/js/debug/h-log.js; then
            echo "legacy h-log.js remains"
            exit 1
          fi
          if test -e .firebase/hosting..cache; then
            echo "generated Firebase cache is tracked"
            exit 1
          fi

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Deploy to Firebase Hosting preview channel
        id: firebase_hosting_preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ODAKO_CHOUSA_SYSTEM_PWA }}
          projectId: odako-chousa-system-pwa
          channelId: v0163a
          expires: 30d
