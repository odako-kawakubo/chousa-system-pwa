name: Deploy v0.1.6.3B Preview

on:
  push:
    branches:
      - v0.1.6.3B
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-preview-v0163-review
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Deploy to Firebase Hosting preview channel
        id: firebase_hosting_preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ODAKO_CHOUSA_SYSTEM_PWA }}
          projectId: odako-chousa-system-pwa
          channelId: v0163a
          expires: 30d
