name: Deploy Review Preview

on:
  push:
    branches:
      - v0.1.6.3B
      - v0.1.6.3C
      - v0.1.6.4A
      - v0.1.6.4B
      - v0.1.6.4C
      - v0.1.6.4
      - v0.1.6.5B
      - v0.1.6.5C
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-preview-v0163-review
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: JavaScript syntax checks
        run: |
          node --check src/js/sync/sync-status.js
          node --check src/js/firestore/firestore-repository.js
          node --check src/js/firestore/firestore-project-list.js
          node --check src/js/projects/project-controller.js
          node --check src/js/projects/project-store.js
          node --check src/js/projects/project-session.js
          node --check src/js/projects/project-entry-ui.js
          node --check src/js/projects/firestore-project-browser.js
          node --check src/js/projects/onedrive-project-browser.js
          node --check src/js/projects/project-transfer.js
          node --check src/js/onedrive/onedrive-client.js
          node --check src/js/onedrive/onedrive-project.js
          node --check src/js/home/home-controller.js
          node --check src/js/demo/sample-session.js
          node --check src/js/ui/auth-ui.js
          node --check src/js/ui/sync-ui.js
          node --check src/js/app-init.js
          node --check src/service-worker.js

      - name: v0.1.6.5C consistency checks
        shell: bash
        run: |
          if grep -R "network-session-guard" -n src; then
            echo "obsolete network-session-guard reference remains"
            exit 1
          fi
          grep -q "version: '0.1.6.5C'" src/config/app-config.js
          grep -q '"version": "0.1.6.5C"' src/version.json
          grep -q "chousa-app-v0.1.6.5C" src/service-worker.js

          # v0.1.6.3で確定した同期基盤を継続して守る。
          grep -q "const PASSIVE_RETRY_LIMIT = 3" src/js/firestore/firestore-repository.js
          grep -q "BULK_SYNC_BATCH_SIZE = 50" src/js/firestore/firestore-repository.js
          grep -q "repositoryWriteChain" src/js/firestore/firestore-repository.js
          grep -q "bulk-required" src/js/firestore/firestore-repository.js
          grep -q "getCurrentProject()?.projectId" src/js/ui/sync-ui.js

          # 起動時は案件未選択。サンプルは明示操作だけで開く。
          grep -q "let currentProject = null" src/js/projects/project-store.js
          grep -q "initializeHome" src/js/app-init.js
          grep -q "サンプル案件を開く" src/js/home/home-controller.js

          # トップから端末内案件を直接開け、アカウント/端末を表示する。
          grep -q "getProjectList" src/js/home/home-controller.js
          grep -q "homeLocalProjectList" src/js/home/home-controller.js
          grep -q "getDeviceDisplayName" src/js/home/home-controller.js
          grep -q "homeMicrosoftName" src/js/home/home-controller.js

          # 既存案件モーダルはイベント配線前にDOMを確定する。
          grep -q "initializeProjectEntryUi();" src/js/app-init.js
          grep -q "data-project-source=\"onedrive\"" src/js/projects/project-entry-ui.js
          grep -q "card.addEventListener('click'" src/js/projects/project-entry-ui.js

          # ヘッダーは未送信件数を通信文言へ混ぜず、件数はまとめて同期側に残す。
          grep -q "text = '良好'" src/js/sync/sync-status.js
          if grep -q 'text = unsentCount' src/js/sync/sync-status.js; then
            echo "unsent count is still mixed into header communication label"
            exit 1
          fi
          grep -q 'まとめて同期 ${status.unsentCount}件' src/js/ui/sync-ui.js

          # CではOneDriveの /me/drive/root 決め打ちを廃止し共有Driveを解決する。
          grep -q "export async function resolveSharedRoot" src/js/onedrive/onedrive-client.js
          grep -q "sharedWithMe" src/js/onedrive/onedrive-client.js
          grep -q "parentReference?.driveId" src/js/onedrive/onedrive-client.js
          grep -q "resolveSharedRoot(ROOT_FOLDER_NAME)" src/js/onedrive/onedrive-project.js
          grep -q "resolveSharedRoot(ROOT_FOLDER_NAME)" src/js/projects/onedrive-project-browser.js
          grep -q "Sites.ReadWrite.All" src/config/microsoft-config.js
          grep -q "この案件番号のFirestore調査データがありません" src/js/projects/onedrive-project-browser.js

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Deploy to Firebase Hosting preview channel
        id: firebase_hosting_preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ODAKO_CHOUSA_SYSTEM_PWA }}
          projectId: odako-chousa-system-pwa
          channelId: v0163a
          expires: 30d
