name: Deploy Review Preview

on:
  push:
    branches:
      - v0.1.6.3B
      - v0.1.6.3C
      - v0.1.6.4A
      - v0.1.6.4B
      - v0.1.6.4C
      - v0.1.6.4
      - v0.1.6.5B
      - v0.1.6.5C
      - v0.1.6.5D
      - v0.1.6.5E
      - v0.1.6.5F
      - v0.1.6.5G
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-preview-v0163-review
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: JavaScript syntax checks
        run: |
          node --check src/js/sync/sync-status.js
          node --check src/js/firestore/firestore-repository.js
          node --check src/js/firestore/firestore-project-list.js
          node --check src/js/auth/microsoft-auth.js
          node --check src/js/auth/graph-session.js
          node --check src/js/projects/project-controller.js
          node --check src/js/projects/project-store.js
          node --check src/js/projects/project-session.js
          node --check src/js/projects/project-creation.js
          node --check src/js/projects/project-navigation.js
          node --check src/js/projects/project-side-panel-controller.js
          node --check src/js/projects/project-factory.js
          node --check src/js/projects/project-entry-ui.js
          node --check src/js/projects/firestore-project-browser.js
          node --check src/js/projects/onedrive-project-browser.js
          node --check src/js/projects/project-transfer.js
          node --check src/js/onedrive/onedrive-client.js
          node --check src/js/onedrive/onedrive-root.js
          node --check src/js/onedrive/onedrive-connection.js
          node --check src/js/onedrive/onedrive-project.js
          node --check src/js/onedrive/onedrive-project-file.js
          node --check src/js/onedrive/openxml-workbook-reader.js
          node --check src/js/home/home-init.js
          node --check src/js/home/home-controller.js
          node --check src/js/home/home-return-control.js
          node --check src/js/settings/settings-controller.js
          node --check src/js/settings/settings-renderer.js
          node --check src/js/demo/sample-session.js
          node --check src/js/ui/auth-ui.js
          node --check src/js/ui/sync-ui.js
          node --check src/js/ui/loading-ui.js
          node --check src/js/app-init.js
          node --check src/js/app-update.js
          node --check src/service-worker.js

      - name: v0.1.6.5G consistency checks
        shell: bash
        run: |
          if grep -R "network-session-guard" -n src; then
            echo "obsolete network-session-guard reference remains"
            exit 1
          fi
          grep -q "version: '0.1.6.5G'" src/config/app-config.js
          grep -q '"version": "0.1.6.5G"' src/version.json
          grep -q "chousa-app-v0.1.6.5G" src/service-worker.js

          # v0.1.6.3で確定した同期基盤を継続して守る。
          grep -q "const PASSIVE_RETRY_LIMIT = 3" src/js/firestore/firestore-repository.js
          grep -q "BULK_SYNC_BATCH_SIZE = 50" src/js/firestore/firestore-repository.js
          grep -q "repositoryWriteChain" src/js/firestore/firestore-repository.js
          grep -q "bulk-required" src/js/firestore/firestore-repository.js
          grep -q "getCurrentProject()?.projectId" src/js/ui/sync-ui.js

          # F: indexを独立トップ、appを案件専用ページにする。
          grep -q './js/home/home-init.js' src/index.html
          if grep -q "location.replace('./app.html')" src/index.html; then
            echo "index still redirects directly to app.html"
            exit 1
          fi
          grep -q "getOpenProjectId" src/js/app-init.js
          grep -q "openHomePage({ replace: true })" src/js/app-init.js
          if grep -q "initializeHome" src/js/app-init.js; then
            echo "app-init still initializes home view"
            exit 1
          fi
          grep -q "openProjectPage" src/js/home/home-controller.js
          grep -q "window.location.assign('./app.html')" src/js/projects/project-navigation.js
          grep -q "window.location.assign('./')" src/js/projects/project-navigation.js
          grep -q "button.textContent = '←'" src/js/home/home-return-control.js

          # F: トップとは別に案件画面内サイドパネルを維持する。
          grep -q 'id="projectSidePanel"' src/app.html
          grep -q 'id="restoreProjectButton"' src/app.html
          grep -q 'id="newProjectModal"' src/app.html
          grep -q 'id="sharedProjectModal"' src/app.html
          grep -q "initializeProjectSidePanelController" src/js/app-init.js
          grep -q "initializeProjectEntryUi" src/js/app-init.js
          grep -q "initializeFirestoreProjectBrowser" src/js/app-init.js
          grep -q "initializeOneDriveProjectBrowser" src/js/app-init.js
          grep -q "initializeProjectTransfer" src/js/app-init.js

          # F: listener受信→適用→Snapshot→cursorの診断を残す。
          grep -q "SYNC_APPLY_START" src/js/projects/project-controller.js
          grep -q "SYNC_APPLY_CHANGE" src/js/projects/project-controller.js
          grep -q "SYNC_STORE_AFTER" src/js/projects/project-controller.js
          grep -q "SYNC_LISTENER_APPLY_RESULT" src/js/projects/project-controller.js
          grep -q "SYNC_CURSOR_BEFORE" src/js/projects/project-controller.js
          grep -q "SYNC_CURSOR_AFTER" src/js/projects/project-controller.js
          grep -q "SYNC_BASELINE_CHECK" src/js/projects/project-controller.js
          grep -q "LOCAL_SNAPSHOT_BEFORE_SAVE" src/js/projects/project-store.js
          grep -q "LOCAL_SNAPSHOT_AFTER_SAVE" src/js/projects/project-store.js

          # Firebase認証とGraph/MSALセッションを分離する。
          grep -q 'graphClientId: "f7074fad-6ea0-467b-98db-e308f01950cc"' src/config/microsoft-config.js
          grep -q 'graphScopes: \["User.Read", "Files.ReadWrite", "Sites.ReadWrite.All"\]' src/config/microsoft-config.js
          grep -q "PublicClientApplication" src/js/auth/graph-session.js
          grep -q "handleRedirectPromise" src/js/auth/graph-session.js
          grep -q "acquireTokenSilent" src/js/auth/graph-session.js
          grep -q "cacheLocation: 'localStorage'" src/js/auth/graph-session.js
          if grep -q "graphAccessToken" src/js/auth/microsoft-auth.js; then
            echo "Firebase auth still owns Graph token storage"
            exit 1
          fi

          # 既知正常のOneDrive root解決を変更しない。
          grep -q "export async function getSurveyRoot" src/js/onedrive/onedrive-root.js
          grep -q "resolveSharedUrl(microsoftConfig.surveyRootUrl)" src/js/onedrive/onedrive-root.js
          grep -q "searchDriveFolders(keyword)" src/js/onedrive/onedrive-root.js
          grep -q "rootSource: 'fixed-share'" src/js/onedrive/onedrive-root.js
          grep -q "rootSource: 'legacy-search'" src/js/onedrive/onedrive-root.js
          grep -q "export async function resolveSharedUrl" src/js/onedrive/onedrive-client.js
          grep -q "export async function searchDriveFolders" src/js/onedrive/onedrive-client.js
          grep -q "getSurveyRoot" src/js/onedrive/onedrive-connection.js
          grep -q "await listDriveChildren(verified)" src/js/onedrive/onedrive-connection.js
          if grep -q "resolveSharedUrl\|searchDriveFolders" src/js/onedrive/onedrive-connection.js; then
            echo "onedrive-connection owns root discovery"
            exit 1
          fi
          if grep -q "resolveSharedUrl\|searchDriveFolders\|getSurveyRoot" src/js/onedrive/onedrive-project.js src/js/projects/onedrive-project-browser.js src/js/onedrive/onedrive-project-file.js; then
            echo "OneDrive consumer bypasses connection root owner"
            exit 1
          fi
          grep -q "getUsableSurveyRoot" src/js/onedrive/onedrive-project.js
          grep -q "getUsableSurveyRoot" src/js/projects/onedrive-project-browser.js

          # G: OneDrive共通ファイル取得 + xlsx/xlsm Open XML読取を分離する。
          grep -q "export async function downloadDriveFile" src/js/onedrive/onedrive-client.js
          if grep -q "readDriveWorkbookRange" src/js/onedrive/onedrive-client.js src/js/onedrive/onedrive-project-file.js; then
            echo "obsolete Graph Workbook API reader remains"
            exit 1
          fi
          grep -q "export async function readOpenXmlCells" src/js/onedrive/openxml-workbook-reader.js
          grep -q "DecompressionStream" src/js/onedrive/openxml-workbook-reader.js
          grep -q "export async function findProjectExcelFile" src/js/onedrive/onedrive-project-file.js
          grep -q "export async function readProjectExcelInfo" src/js/onedrive/onedrive-project-file.js
          grep -q "downloadDriveFile" src/js/onedrive/onedrive-project-file.js
          grep -q "readOpenXmlCells" src/js/onedrive/onedrive-project-file.js
          grep -q "xlsm" src/js/onedrive/onedrive-project-file.js
          grep -q "F2" src/js/onedrive/onedrive-project-file.js
          grep -q "K2" src/js/onedrive/onedrive-project-file.js
          grep -q "L2" src/js/onedrive/onedrive-project-file.js
          grep -q "isInternalRequestFile" src/js/onedrive/onedrive-project-file.js
          grep -q "readProjectExcelInfo" src/js/projects/onedrive-project-browser.js
          grep -q "address: excelInfo.address" src/js/projects/onedrive-project-browser.js
          grep -q "projectExcelFileId" src/js/projects/onedrive-project-browser.js

          # G: 共通待機UIを起動・案件操作・OneDrive・アップデートから利用する。
          grep -q "export function beginLoading" src/js/ui/loading-ui.js
          grep -q "export function endLoading" src/js/ui/loading-ui.js
          grep -q "beginLoading('起動しています…'" src/js/app-init.js
          grep -q "beginLoading('案件を作成しています…'" src/js/home/home-controller.js
          grep -q "beginLoading('案件を作成しています…'" src/js/projects/project-side-panel-controller.js
          grep -q "beginLoading('案件ファイルを取得しています…'" src/js/projects/onedrive-project-browser.js
          grep -q "beginLoading('アップデートを確認しています…'" src/js/app-update.js
          grep -q "アップデートをダウンロードしています…" src/js/app-update.js
          grep -q "アップデートを適用しています…" src/js/app-update.js
          grep -q "waitForPaint" src/js/app-update.js

          # F: Firestoreありは既存、なしだけOneDrive正式案件を作る。
          grep -q "readFirestoreProjectList" src/js/projects/onedrive-project-browser.js
          grep -q "if (!project)" src/js/projects/onedrive-project-browser.js
          grep -q "createFormalProjectFromOneDriveSnapshot" src/js/projects/onedrive-project-browser.js
          grep -q "createFormalProjectFromOneDrive" src/js/projects/project-factory.js
          grep -q "isTemporary: false" src/js/projects/project-factory.js
          grep -q "projectType: 'formal'" src/js/projects/project-factory.js

          # ヘッダーはFirestore通信だけ。未送信件数はまとめて同期側。
          grep -q "text = '良好'" src/js/sync/sync-status.js
          if grep -q 'text = unsentCount' src/js/sync/sync-status.js; then
            echo "unsent count is mixed into header communication label"
            exit 1
          fi
          grep -q 'まとめて同期 ${status.unsentCount}件' src/js/ui/sync-ui.js

          # Gの追加モジュールもオフライン起動キャッシュへ含める。
          grep -q "./js/ui/loading-ui.js" src/service-worker.js
          grep -q "./js/onedrive/onedrive-project-file.js" src/service-worker.js
          grep -q "./js/onedrive/openxml-workbook-reader.js" src/service-worker.js
          grep -q "./js/home/home-init.js" src/service-worker.js
          grep -q "./js/projects/project-navigation.js" src/service-worker.js
          grep -q "./js/projects/project-creation.js" src/service-worker.js
          grep -q "./js/projects/project-side-panel-controller.js" src/service-worker.js
          grep -q "./js/auth/graph-session.js" src/service-worker.js
          grep -q "./js/onedrive/onedrive-root.js" src/service-worker.js

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Deploy to Firebase Hosting preview channel
        id: firebase_hosting_preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ODAKO_CHOUSA_SYSTEM_PWA }}
          projectId: odako-chousa-system-pwa
          channelId: v0163a
          expires: 30d
