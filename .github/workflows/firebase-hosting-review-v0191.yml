name: Deploy v0.1.9.11 Review

on:
  push:
    branches:
      - work/v0.1.9.1-20261001

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src/js src/config -type f -name '*.js' -print0)
          node --check src/service-worker.js

      - name: Module and app shell reference checks
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const roots = ['src/js', 'src/config'];
          const files = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes:true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile() && entry.name.endsWith('.js')) files.push(full);
            }
          }
          roots.forEach(walk);
          const missing = [];
          const re = /(?:from\s*|import\s*\()\s*['"](\.[^'"]+)['"]/g;
          for (const file of files) {
            const text = fs.readFileSync(file, 'utf8');
            let match;
            while ((match = re.exec(text))) {
              const resolved = path.resolve(path.dirname(file), match[1]);
              const candidates = [resolved, `${resolved}.js`, path.join(resolved, 'index.js')];
              if (!candidates.some((candidate) => fs.existsSync(candidate))) missing.push(`${file} -> ${match[1]}`);
            }
          }
          if (missing.length) {
            console.error('Missing relative module references:\n' + missing.join('\n'));
            process.exit(1);
          }

          const sw = fs.readFileSync('src/service-worker.js', 'utf8');
          const shell = [...sw.matchAll(/['"]\.\/([^'"]+)['"]/g)].map((m) => m[1]);
          const missingShell = shell.filter((rel) => rel && !fs.existsSync(path.join('src', rel)));
          if (missingShell.length) {
            console.error('Missing APP_SHELL files:\n' + missingShell.join('\n'));
            process.exit(1);
          }

          const shellSet = new Set(shell.map((rel) => './' + rel));
          const jsShellMissing = files
            .filter((file) => file.startsWith('src/js/'))
            .map((file) => './' + file.replace(/^src\//, ''))
            .filter((rel) => !shellSet.has(rel));
          if (jsShellMissing.length) {
            console.error('Local JS modules missing from APP_SHELL:\n' + jsShellMissing.join('\n'));
            process.exit(1);
          }
          NODE

      - name: Output formatting regression checks
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { formatSamplingCode, formatPartDisplay } from './src/js/output/output-format.js';
          const assert = (condition, message) => { if (!condition) throw new Error(message); };
          assert(formatSamplingCode({ projectNo:'260701014', sampleNo:'1', branch:1 }) === '260701014-1 1', 'sampling code format changed');
          assert(formatPartDisplay('壁、床').split === false, 'short two-part label should remain one line');
          const split = formatPartDisplay('壁、天井');
          assert(split.split === true && split.lines.join('|') === '壁|天井', 'long multi-part label should split at delimiter');
          assert(formatPartDisplay('ハト小屋').split === false, 'single long part should stay one line');
          NODE


      - name: Core architecture regression checks
        shell: bash
        run: |
          set -euo pipefail

          # Firestore差分保存・未送信・直列化
          grep -q "const PASSIVE_RETRY_LIMIT = 3" src/js/firestore/firestore-repository.js
          grep -q "BULK_SYNC_BATCH_SIZE = 50" src/js/firestore/firestore-repository.js
          grep -q "repositoryWriteChain" src/js/firestore/firestore-repository.js
          grep -q "bulk-required" src/js/firestore/firestore-repository.js

          # 変更履歴 + cursor同期
          grep -q "SYNC_APPLY_START" src/js/projects/project-record-apply.js
          grep -q "SYNC_APPLY_CHANGE" src/js/projects/project-record-apply.js
          grep -q "SYNC_STORE_AFTER" src/js/projects/project-record-apply.js
          grep -q "SYNC_LISTENER_APPLY_RESULT" src/js/projects/project-controller.js
          grep -q "SYNC_CURSOR_BEFORE" src/js/projects/project-sync-meta.js
          grep -q "SYNC_CURSOR_AFTER" src/js/projects/project-sync-meta.js
          grep -q "SYNC_BASELINE_CHECK" src/js/projects/project-controller.js
          grep -q "LOCAL_SNAPSHOT_BEFORE_SAVE" src/js/projects/project-store.js
          grep -q "LOCAL_SNAPSHOT_AFTER_SAVE" src/js/projects/project-store.js

          # Firebase認証とGraph/MSALを分離
          grep -q "PublicClientApplication" src/js/auth/graph-session.js
          grep -q "handleRedirectPromise" src/js/auth/graph-session.js
          grep -q "acquireTokenSilent" src/js/auth/graph-session.js
          grep -q "cacheLocation: 'localStorage'" src/js/auth/graph-session.js
          if grep -q "graphAccessToken" src/js/auth/microsoft-auth.js; then
            echo "Firebase auth owns Graph token storage"
            exit 1
          fi

          # OneDrive root責務を一元化
          grep -q "export async function getSurveyRoot" src/js/onedrive/onedrive-root.js
          grep -q "resolveSharedUrl" src/js/onedrive/onedrive-root.js
          grep -q "searchDriveFolders" src/js/onedrive/onedrive-root.js
          grep -q "rootSource: 'fixed-share'" src/js/onedrive/onedrive-root.js
          grep -q "rootSource: 'legacy-search'" src/js/onedrive/onedrive-root.js
          grep -q "getSurveyRoot" src/js/onedrive/onedrive-connection.js
          grep -q "getUsableSurveyRoot" src/js/onedrive/onedrive-project.js
          grep -q "getUsableSurveyRoot" src/js/projects/onedrive-project-browser.js

          # xlsx/xlsmはOpen XML reader経由
          grep -q "export async function readOpenXmlCells" src/js/onedrive/openxml-workbook-reader.js
          grep -q "DecompressionStream" src/js/onedrive/openxml-workbook-reader.js
          grep -q "readOpenXmlCells" src/js/onedrive/onedrive-project-file.js
          grep -q "xlsm" src/js/onedrive/onedrive-project-file.js
          grep -q "F2" src/js/onedrive/onedrive-project-file.js
          grep -q "K2" src/js/onedrive/onedrive-project-file.js
          grep -q "L2" src/js/onedrive/onedrive-project-file.js
          grep -q "isInternalRequestFile" src/js/onedrive/onedrive-project-file.js

          # 正式案件起動と3レコードバックアップ
          grep -q "tryReadProjectExcel" src/js/projects/onedrive-project-browser.js
          grep -q "readFirestoreProjectList" src/js/projects/onedrive-project-browser.js
          grep -q "createFormalProjectFromOneDriveSnapshot" src/js/projects/onedrive-project-browser.js
          grep -q "const BACKUP_INTERVAL_MS = 10 \* 60 \* 1000" src/js/onedrive/system-data-backup.js
          grep -q "const MAX_GENERATIONS_PER_DEVICE = 15" src/js/onedrive/system-data-backup.js
          grep -q "finishRecords" src/js/onedrive/system-data-backup.js
          grep -q "materialRecords" src/js/onedrive/system-data-backup.js
          grep -q "photoRecords" src/js/onedrive/system-data-backup.js

          # 写真Blob → OneDrive → photoRecord参照確定
          grep -q "configurePhotoLocalStore" src/js/photos/photo-local-store.js
          grep -q "resolveProjectId" src/js/photos/photo-local-store.js
          grep -q "listPendingPhotoBlobEntries(project.projectId, photoIds)" src/js/photos/photo-onedrive-sync.js
          grep -q "PHOTO_SYNC_BINDING_MISSING" src/js/photos/photo-onedrive-sync.js
          grep -q "PHOTO_SYNC_PENDING" src/js/photos/photo-onedrive-sync.js
          grep -q "PHOTO_UPLOAD_START" src/js/photos/photo-onedrive-sync.js
          grep -q "PHOTO_VERIFY_OK" src/js/photos/photo-onedrive-sync.js
          grep -q "oneDriveDriveId: text(record.oneDriveDriveId)" src/js/firestore/record-serializer.js
          grep -q "originalItemId: text(record.originalItemId)" src/js/firestore/record-serializer.js
          grep -q "completedItemId: text(record.completedItemId)" src/js/firestore/record-serializer.js
          grep -q "fetchRemotePhotoThumbnail" src/js/photos/photo-remote-reader.js
          grep -q "fetchRemoteCompletedPhoto" src/js/photos/photo-remote-reader.js
          grep -q "remoteThumbnailUrls" src/js/photos/photo-preview-manager.js
          grep -q "ensureRemoteThumbnail" src/js/photos/photo-preview-manager.js

          # 明示アップデート・オフラインキャッシュ
          grep -q "sameBuild" src/js/app-update.js
          grep -q "cache: 'no-store'" src/js/app-update.js
          grep -q "event.data?.type==='SKIP_WAITING'" src/service-worker.js
          grep -q "worker.postMessage({ type: 'SKIP_WAITING' })" src/js/pwa/pwa-controller.js
          if grep -q "then(() => self.skipWaiting())" src/service-worker.js; then
            echo "service worker auto activates on install"
            exit 1
          fi

          # ヘッダー通信状態と未送信件数を分離
          grep -q "text = '良好'" src/js/sync/sync-status.js
          if grep -q "text = unsentCount" src/js/sync/sync-status.js; then
            echo "unsent count is mixed into communication label"
            exit 1
          fi
          grep -q 'まとめて同期 ${status.unsentCount}件' src/js/ui/sync-ui.js

      - name: v0.1.9.11 review consistency checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q "version: '0.1.9.11'" src/config/app-config.js
          grep -q "revision: ''" src/config/app-config.js
          grep -q "mode: 'review'" src/config/app-config.js
          grep -q '"version": "0.1.9.11"' src/version.json
          grep -q '"revision": ""' src/version.json
          grep -q "chousa-app-v0.1.9.11" src/service-worker.js
          grep -q "chousa-output-libs-v01911" src/service-worker.js
          for file in camera-preferences.js camera-state.js camera-session.js camera-capture.js camera-photo-id.js; do
            test -f "src/js/camera/$file" || { echo "camera module split is incomplete: $file"; exit 1; }
          done
          if grep -q "sampleProject" src/js/camera/camera-*.js; then
            echo "camera module still depends on sampleProject"
            exit 1
          fi
          grep -q "import { nextPhotoId } from './camera-photo-id.js';" src/js/camera/camera-controller.js || { echo "nextPhotoId import is missing"; exit 1; }
          grep -q "export function nextPhotoId" src/js/camera/camera-photo-id.js || { echo "nextPhotoId definition is missing"; exit 1; }
          if grep -q "currentSamplingTarget()" src/js/camera/camera-controller.js; then
            echo "camera state argument missing: currentSamplingTarget"
            exit 1
          fi
          if grep -q "currentVisualTarget()" src/js/camera/camera-controller.js; then
            echo "camera state argument missing: currentVisualTarget"
            exit 1
          fi
          if grep -q "currentStageInfo()" src/js/camera/camera-controller.js; then
            echo "camera state argument missing: currentStageInfo"
            exit 1
          fi
          if grep -q "saveCapturedPhoto" src/js/camera/camera-controller.js; then
            echo "camera controller still owns captured photo persistence"
            exit 1
          fi
          if grep -q "photoRecordStore.set(record)" src/js/camera/camera-controller.js; then
            echo "camera controller still owns photo record registration"
            exit 1
          fi
          grep -q "const stored = photoRecordStore.set(record);" src/js/photos/photo-record-actions.js || { echo "photo record actions do not own camera photo registration"; exit 1; }
          grep -q "await saveCapturedPhoto({" src/js/photos/photo-record-actions.js || { echo "photo record actions do not own captured photo persistence"; exit 1; }
          grep -q "persistPhotoForProject(getCurrentProject(), record, 'photo-board-editor-save')" src/js/photos/photo-board-editor-persistence.js || { echo "board editor does not persist edited photo record"; exit 1; }
          if grep -q "registerCameraPreview(item, { renderAfter: false })" src/js/photos/photo-controller.js; then
            echo "board editor still reuses camera persistence path"
            exit 1
          fi
          grep -q "const isLocalPreview = localPreviewUrls.has(photoId);" src/js/photos/photo-preview-manager.js || { echo "local thumbnail eager loading is missing"; exit 1; }
          grep -q "image.loading = isLocalPreview ? 'eager' : 'lazy';" src/js/photos/photo-preview-manager.js || { echo "local thumbnail loading policy is missing"; exit 1; }
          grep -q "function refreshCameraPhotoBlock(record)" src/js/photos/photo-controller.js || { echo "camera photo local block refresh is missing"; exit 1; }
          grep -q "refreshBlock: refreshCameraPhotoBlock" src/js/photos/photo-controller.js || { echo "camera photo does not use local block refresh"; exit 1; }
          grep -q "export function hydrateThumbnailImages(scope)" src/js/photos/photo-preview-manager.js || { echo "block scoped thumbnail hydrate is missing"; exit 1; }
          grep -q "hydrateThumbnailImages(updated);" src/js/photos/photo-controller.js || { echo "local photo block is not hydrated after replacement"; exit 1; }
          grep -q "PHOTO_LOCAL_PREVIEW_SET" src/js/photos/photo-preview-manager.js || { echo "photo local preview diagnostic missing"; exit 1; }
          grep -q "PHOTO_THUMB_READY" src/js/photos/photo-preview-manager.js || { echo "photo thumb ready diagnostic missing"; exit 1; }
          grep -q "PHOTO_THUMB_LOADING" src/js/photos/photo-preview-manager.js || { echo "photo thumb loading diagnostic missing"; exit 1; }
          grep -q "PHOTO_SYNC_REFERENCE_UPDATE" src/js/photos/photo-onedrive-sync.js || { echo "photo OneDrive diagnostic missing"; exit 1; }
          grep -q "SYNC_APPLY_PHOTO" src/js/projects/project-record-apply.js || { echo "photo sync apply diagnostic missing"; exit 1; }
          grep -q "listener-query-removed-not-record-delete" src/js/projects/project-record-apply.js || { echo "photo listener removed guard is missing"; exit 1; }
          grep -q "export function renderVisualTargetBlock" src/js/photos/photo-renderer.js || { echo "visual local block renderer is missing"; exit 1; }
          grep -q "export function renderSamplingPointBlock" src/js/photos/photo-renderer.js || { echo "sampling local block renderer is missing"; exit 1; }
          if grep -R "caseHeaderTitle" -n src; then
            echo "legacy caseHeaderTitle remains"
            exit 1
          fi
          if grep -q "sampleProject" src/js/camera/camera-controller.js; then
            echo "camera still depends on sampleProject"
            exit 1
          fi
          if grep -q "finishProjectBanner" src/js/finish-table/finish-table-renderer.js src/js/finish-table/finish-table-controller.js; then
            echo "legacy finish project banner remains"
            exit 1
          fi
          if grep -q "formatProjectLabel" src/js/finish-table/finish-table-controller.js src/js/projects/project-session.js; then
            echo "legacy project label writer remains"
            exit 1
          fi

          # チュートリアル操作制限はアプリ側permission stateへ集約
          test -f src/js/guide/tutorial-state.js
          test -f src/js/guide/tutorial-snapshot.js
          grep -q "export function isTutorialActionAllowed" src/js/guide/tutorial-state.js || { echo "tutorial permission API missing"; exit 1; }
          grep -q "export function captureTutorialSnapshot" src/js/guide/tutorial-snapshot.js || { echo "tutorial snapshot API missing"; exit 1; }
          if test -e src/js/guide/tutorial-runtime.js; then
            echo "obsolete tutorial runtime still exists"
            exit 1
          fi
          if grep -R "new MutationObserver" -n src/js/guide; then
            echo "guide MutationObserver must not return"
            exit 1
          fi
          grep -q "isTutorialActionAllowed" src/js/finish-table/finish-table-interactions.js || { echo "finish interactions are not tutorial guarded"; exit 1; }
          grep -q "isTutorialActionAllowed" src/js/finish-table/finish-table-controller.js || { echo "finish structure actions are not tutorial guarded"; exit 1; }
          grep -q "isTutorialActionAllowed" src/js/ui/tabs.js || { echo "tab user actions are not tutorial guarded"; exit 1; }
          grep -q "chousa:finish-candidate-change" src/js/finish-table/finish-table-candidate-input.js || { echo "candidate popup guide notification missing"; exit 1; }
          grep -q "roomFieldInput.blur()" src/js/finish-table/finish-table-interactions.js || { echo "room field Enter commit missing"; exit 1; }
          grep -q "includeCandidate:true" src/js/guide/guide-controller.js || { echo "candidate popup spotlight inclusion missing"; exit 1; }
          grep -q "openHomePage({ replace:true })" src/js/guide/guide-controller.js || { echo "tutorial interrupt home return missing"; exit 1; }
          grep -q "finish-add-row-result" src/js/guide/guide-data.js || { echo "add-row result step missing"; exit 1; }
          grep -q "finish-add-room-result" src/js/guide/guide-data.js || { echo "add-room result step missing"; exit 1; }
          grep -q "finish-add-floor-result" src/js/guide/guide-data.js || { echo "add-floor result step missing"; exit 1; }
          if grep -R "guide-blocker\|guide-layer\|lockTargets\|resolveGuideLockTargets\|blockOutsideTutorialTarget\|stopImmediatePropagation" -n src/js/guide src/css/guide.css; then
            echo "obsolete tutorial event/blocker lock remains"
            exit 1
          fi

          # 仕上表候補入力UIをcontrollerから分離
          test -f src/js/finish-table/finish-table-candidate-input.js
          grep -q "getActiveCandidateSelection" src/js/finish-table/finish-table-candidate-input.js || { echo "finish candidate module API missing"; exit 1; }
          grep -q "from './finish-table-candidate-input.js'" src/js/finish-table/finish-table-interactions.js || { echo "finish interactions do not use candidate module"; exit 1; }
          if grep -q "let activeCandidateInput" src/js/finish-table/finish-table-controller.js; then
            echo "finish controller still owns candidate popup state"
            exit 1
          fi

          # 仕上表編集セッションをcontrollerから分離
          test -f src/js/finish-table/finish-table-edit-session.js
          grep -q "configureFinishTableEditSession" src/js/finish-table/finish-table-controller.js || { echo "finish edit session is not configured"; exit 1; }
          grep -q "beginFinishEdit" src/js/finish-table/finish-table-interactions.js || { echo "finish edit session begin hook missing"; exit 1; }
          grep -q "resetFinishTableEditSession" src/js/finish-table/finish-table-controller.js || { echo "finish edit session reset hook missing"; exit 1; }
          if grep -q "pendingEditSnapshot\|pendingEditBeforeValue\|explicitlyCommittedInputKey\|explicitCommitReleaseTimer" src/js/finish-table/finish-table-controller.js; then
            echo "finish controller still owns edit session state"
            exit 1
          fi

          # 仕上表の構造操作と疎保存をactionsから分離
          test -f src/js/finish-table/finish-table-structure-actions.js
          test -f src/js/finish-table/finish-table-persistence.js
          grep -q "from './finish-table-structure-actions.js'" src/js/finish-table/finish-table-controller.js || { echo "finish controller does not use structure module"; exit 1; }
          grep -q "export function addNormalFloor" src/js/finish-table/finish-table-structure-actions.js || { echo "normal floor structure action missing"; exit 1; }
          grep -q "export function addRoomAfter" src/js/finish-table/finish-table-structure-actions.js || { echo "room insertion structure action missing"; exit 1; }
          grep -q "export function persistSparseFinishRecord" src/js/finish-table/finish-table-persistence.js || { echo "sparse persistence API missing"; exit 1; }

          # 仕上表セル編集・建材登録・使用箇所派生をactionsから分離
          test -f src/js/finish-table/finish-table-cell-actions.js
          test -f src/js/finish-table/material-usage-derived.js
          grep -q "from './finish-table-cell-actions.js'" src/js/finish-table/finish-table-interactions.js || { echo "finish interactions do not use cell actions"; exit 1; }
          grep -q "from './finish-table-cell-actions.js'" src/js/finish-table/finish-table-candidate-input.js || { echo "finish candidate input does not use cell actions"; exit 1; }
          grep -q "material-usage-derived.js" src/js/output/output-view-model.js || { echo "output does not use usage derived module"; exit 1; }
          grep -q "material-usage-derived.js" src/js/materials/material-list-controller.js || { echo "material list does not use usage derived module"; exit 1; }
          grep -q "export function registerMaterialForCell" src/js/finish-table/finish-table-cell-actions.js || { echo "material registration cell action missing"; exit 1; }
          grep -q "export function refreshMaterialUsageDerivedFields" src/js/finish-table/material-usage-derived.js || { echo "material usage derivation API missing"; exit 1; }

          # 部屋コピー責務をactionsから分離
          test -f src/js/finish-table/finish-table-room-copy.js
          grep -q "from './finish-table-room-copy.js'" src/js/finish-table/finish-table-controller.js || { echo "finish controller does not use room copy module"; exit 1; }
          grep -q "from './finish-table-room-copy.js'" src/js/finish-table/finish-table-view-model.js || { echo "finish view model does not use room copy module"; exit 1; }
          grep -q "export function executeRoomCopy" src/js/finish-table/finish-table-room-copy.js || { echo "room copy execution API missing"; exit 1; }
          grep -q "export function restoreRoomCopy" src/js/finish-table/finish-table-room-copy.js || { echo "room copy restore API missing"; exit 1; }

          # サンプル初期データ生成と派生値参照をactionsから分離
          test -f src/js/finish-table/finish-table-sample-seed.js
          grep -q "finish-table-sample-seed.js" src/js/demo/sample-session.js || { echo "sample session does not use sample seed module"; exit 1; }
          grep -q "material-usage-derived.js" src/js/projects/project-controller.js || { echo "project controller still uses old usage import"; exit 1; }
          grep -q "material-usage-derived.js" src/js/materials/simple-list.js || { echo "simple list still uses old usage import"; exit 1; }
          grep -q "material-usage-derived.js" src/js/materials/material-operations.js || { echo "material operations still uses old usage import"; exit 1; }
          grep -q "export function seedInitialMaterials" src/js/finish-table/finish-table-sample-seed.js || { echo "sample material seed API missing"; exit 1; }
          grep -q "export function seedInitialFinishRecords" src/js/finish-table/finish-table-sample-seed.js || { echo "sample finish seed API missing"; exit 1; }
          if grep -R "refreshMaterialUsageDerivedFields.*finish-table-actions\|getMaterialUsageRoomLabels.*finish-table-actions\|getMaterialUsageRoomNos.*finish-table-actions" -n src/js; then
            echo "legacy material usage imports remain"
            exit 1
          fi

          # 旧finish-table-actions facadeは完全撤去
          test ! -e src/js/finish-table/finish-table-actions.js || { echo "obsolete finish-table-actions facade remains"; exit 1; }
          test -f src/js/finish-table/finish-table-room-actions.js
          test -f src/js/finish-table/finish-table-record-transaction.js
          grep -q "finish-table-room-actions.js" src/js/finish-table/finish-table-interactions.js || { echo "finish interactions do not use room actions"; exit 1; }
          grep -q "finish-table-record-transaction.js" src/js/finish-table/finish-table-controller.js || { echo "finish controller does not use record transaction"; exit 1; }
          grep -q "finish-table-record-transaction.js" src/js/finish-table/finish-table-edit-session.js || { echo "finish edit session does not use record transaction"; exit 1; }
          if grep -R "finish-table-actions.js" -n src/js; then
            echo "obsolete finish-table-actions reference remains"
            exit 1
          fi

          # 最終整理: 現役moduleのAPP_SHELL収録
          grep -q "./js/materials/material-list-renderer.js" src/service-worker.js
          grep -q "./js/materials/material-list-view-model.js" src/service-worker.js
          grep -q "./js/materials/material-operations-renderer.js" src/service-worker.js
          grep -q "./js/materials/material-operations.js" src/service-worker.js
          grep -q "./js/materials/material-sampling-autofill.js" src/service-worker.js
          grep -q "./js/photos/photo-renderer.js" src/service-worker.js

          # Output PDF Preview状態/生成をcontrollerから分離
          test -f src/js/output/output-pdf-preview-controller.js
          grep -q "from './output-pdf-preview-controller.js'" src/js/output/output-controller.js || { echo "output controller does not use pdf preview controller"; exit 1; }
          grep -q "export function getOutputPdfPreviewState" src/js/output/output-pdf-preview-controller.js || { echo "output preview state API missing"; exit 1; }
          grep -q "export async function renderOutputPdfPreview" src/js/output/output-pdf-preview-controller.js || { echo "output preview render API missing"; exit 1; }
