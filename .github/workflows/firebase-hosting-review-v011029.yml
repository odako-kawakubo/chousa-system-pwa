name: Deploy v0.1.10.30 Review

on:
  push:
    branches:
      - work/v0.1.10.6-20261013

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src/js src/config -type f -name '*.js' -print0)
          node --check src/service-worker.js
      - name: App version and survey map regression checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q "version: '0.1.10.30'" src/config/app-config.js
          grep -q '"version": "0.1.10.30"' src/version.json
          grep -q "chousa-app-v0.1.10.30" src/service-worker.js
          grep -q 'data-survey-room-area-step' src/js/survey-map/survey-map-controller.js
          grep -q 'data-survey-zoom-reset' src/js/survey-map/survey-map-controller.js
          grep -q 'startInlineTextEdit' src/js/survey-map/survey-map-controller.js
          grep -q 'pinchGesture' src/js/survey-map/survey-map-controller.js
          test -f src/app.html

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Deploy to existing Firebase Hosting preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ODAKO_CHOUSA_SYSTEM_PWA }}
          projectId: odako-chousa-system-pwa
          channelId: v0163a
