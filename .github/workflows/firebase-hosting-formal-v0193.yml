          grep -q "export function changedMaterialBusinessFields" src/js/materials/material-list-persistence.js || { echo "material business field diff API missing"; exit 1; }
          if grep -q "touchFieldEditedAt\|persistMaterialForProject" src/js/materials/material-list-controller.js src/js/materials/material-list-edit-actions.js; then
            echo "material list controller/edit actions still own persistence primitives"
            exit 1
          fi

          # Project Realtime差分適用をcontrollerから分離
          test -f src/js/projects/project-record-apply.js
          grep -q "from './project-record-apply.js'" src/js/projects/project-controller.js || { echo "project controller does not use record apply module"; exit 1; }
          grep -q "export function applyProjectRecordChanges" src/js/projects/project-record-apply.js || { echo "project record apply API missing"; exit 1; }
          grep -q "listener-query-removed-not-record-delete" src/js/projects/project-record-apply.js || { echo "photo listener removed guard moved incorrectly"; exit 1; }
          grep -q "SYNC_APPLY_CHANGE" src/js/projects/project-record-apply.js || { echo "project record apply diagnostics missing"; exit 1; }
          if grep -q "function applyProjectRecordChanges\|listUnsent\|hydrateIncomingMaterialRecord\|applyKnownFinishChange\|restoreKnownFinishRecords" src/js/projects/project-controller.js; then
            echo "project controller still owns realtime record apply logic"
            exit 1
          fi

          # Project同期meta/cursor管理をcontrollerから分離
          test -f src/js/projects/project-sync-meta.js
          grep -q "from './project-sync-meta.js'" src/js/projects/project-controller.js || { echo "project controller does not use sync meta module"; exit 1; }
          grep -q "export function getProjectRecordCursors" src/js/projects/project-sync-meta.js || { echo "project cursor API missing"; exit 1; }
          grep -q "export function updateProjectRecordCursors" src/js/projects/project-sync-meta.js || { echo "project cursor update API missing"; exit 1; }
          grep -q "export function normalizeProjectFinishChangeCursor" src/js/projects/project-sync-meta.js || { echo "finish cursor normalize API missing"; exit 1; }
          grep -q "export async function recordProjectSyncDeviceContact" src/js/projects/project-sync-meta.js || { echo "project device contact API missing"; exit 1; }
          if grep -q "function normalizeRecordCursors\|function normalizeFinishChangeCursor\|function updateProjectSyncCursors\|function recordProjectDeviceContact\|function cleanupFinishChangeLogIfDue" src/js/projects/project-controller.js; then
            echo "project controller still owns sync meta logic"
            exit 1
          fi

          # Project同期差分の画面影響判定をcontrollerから分離
          test -f src/js/projects/project-view-impact.js
          grep -q "from './project-view-impact.js'" src/js/projects/project-controller.js || { echo "project controller does not use view impact module"; exit 1; }
          grep -q "export function createEmptyProjectViewImpact" src/js/projects/project-view-impact.js || { echo "project view impact API missing"; exit 1; }
          grep -q "export function registerFinishProjectViewImpact" src/js/projects/project-view-impact.js || { echo "finish impact API missing"; exit 1; }
          grep -q "export function registerMaterialProjectViewImpact" src/js/projects/project-view-impact.js || { echo "material impact API missing"; exit 1; }
          grep -q "export function registerPhotoProjectViewImpact" src/js/projects/project-view-impact.js || { echo "photo impact API missing"; exit 1; }
          if grep -q "function equalRecordValue\|function changedFields\|FINISH_IMPACT_FIELDS\|MATERIAL_IMPACT_FIELDS" src/js/projects/project-controller.js; then
            echo "project controller still owns view impact logic"
            exit 1
          fi

          # Photo構造整理の最終掃除
          if grep -q "function createPhotoViewerTransformState\|function resetPhotoViewerTransform" src/js/photos/photo-viewer.js; then
            echo "photo viewer still contains stale local transform definitions"
            exit 1
          fi
          if grep -q "const STAGES =" src/js/photos/photo-board-editor.js; then
            echo "photo board editor still contains obsolete stage constant"
            exit 1
          fi
          if grep -R "finish-table-actions.js" -n src/js; then
            echo "obsolete finish-table-actions reference remains"
            exit 1
          fi

          # Photo ViewerのGesture処理を分離
          test -f src/js/photos/photo-viewer-gesture.js
          grep -q "from './photo-viewer-gesture.js'" src/js/photos/photo-viewer.js || { echo "photo viewer does not use gesture module"; exit 1; }
          grep -q "export function bindPhotoViewerGestureStage" src/js/photos/photo-viewer-gesture.js || { echo "photo viewer gesture bind API missing"; exit 1; }
          grep -q "export function createPhotoViewerTransformState" src/js/photos/photo-viewer-gesture.js || { echo "photo viewer transform state API missing"; exit 1; }
          grep -q "export function resetPhotoViewerTransform" src/js/photos/photo-viewer-gesture.js || { echo "photo viewer reset transform API missing"; exit 1; }
          grep -q "export function applyPhotoViewerTransform" src/js/photos/photo-viewer-gesture.js || { echo "photo viewer apply transform API missing"; exit 1; }
          if grep -q "function createTransformState\|function bindGestureStage\|function clamp(value, min, max)\|function pointDistance" src/js/photos/photo-viewer.js; then
            echo "photo viewer still owns gesture primitives"
            exit 1
          fi

          # Photo Board Editorのフォーム/draft編集を分離
          test -f src/js/photos/photo-board-editor-form.js
          grep -q "from './photo-board-editor-form.js'" src/js/photos/photo-board-editor.js || { echo "board editor does not use form module"; exit 1; }
          grep -q "export function renderBoardEditorForm" src/js/photos/photo-board-editor-form.js || { echo "board editor form render API missing"; exit 1; }
          grep -q "export function updateBoardEditorDraftFromEvent" src/js/photos/photo-board-editor-form.js || { echo "board editor draft update API missing"; exit 1; }
          grep -q "export function boardEditorSamplingMaterials" src/js/photos/photo-board-editor-form.js || { echo "board editor sampling form API missing"; exit 1; }
          if grep -q "function visualFields\|function samplingFields\|function syncSamplingPlace" src/js/photos/photo-board-editor.js; then
            echo "board editor still owns form/draft logic"
            exit 1
          fi

          # Photo Board Editorの完成画像生成/保存を分離
          test -f src/js/photos/photo-board-editor-persistence.js
          grep -q "from './photo-board-editor-persistence.js'" src/js/photos/photo-board-editor.js || { echo "board editor does not use persistence module"; exit 1; }
          grep -q "export async function persistBoardEditorEntry" src/js/photos/photo-board-editor-persistence.js || { echo "board editor persistence API missing"; exit 1; }
          grep -q "savePhotoBlob" src/js/photos/photo-board-editor-persistence.js || { echo "board editor persistence does not save blobs"; exit 1; }
          grep -q "updateCameraPhotoRecord" src/js/photos/photo-board-editor-persistence.js || { echo "board editor persistence does not update local record"; exit 1; }
          grep -q "getAvailablePhotoFileName" src/js/photos/photo-board-editor-persistence.js || { echo "board editor persistence does not own filename resolution"; exit 1; }
          if grep -q "composeCompletedBlob_\|persistEntry_\|savePhotoBlob\|updateCameraPhotoRecord\|getAvailablePhotoFileName\|touchFieldEditedAt\|getDeviceCode" src/js/photos/photo-board-editor.js; then
            echo "board editor still owns persistence"
            exit 1
          fi

          # Photo Board EditorのDOMイベント/スワイプを分離
          test -f src/js/photos/photo-board-editor-interactions.js
          grep -q "from './photo-board-editor-interactions.js'" src/js/photos/photo-board-editor.js || { echo "board editor does not use interactions module"; exit 1; }
          grep -q "export function bindPhotoBoardEditorInteractions" src/js/photos/photo-board-editor-interactions.js || { echo "board editor interactions API missing"; exit 1; }
          grep -q "pointerdown" src/js/photos/photo-board-editor-interactions.js || { echo "board editor swipe start missing"; exit 1; }
          grep -q "pointerup" src/js/photos/photo-board-editor-interactions.js || { echo "board editor swipe end missing"; exit 1; }
          if grep -q "function bindEvents\|handleEditorSwipeStart\|handleEditorSwipeEnd\|let swipeStart" src/js/photos/photo-board-editor.js; then
            echo "board editor still owns DOM interactions"
            exit 1
          fi

          # Photo Board Editorのセッション/履歴を分離
          test -f src/js/photos/photo-board-editor-session.js
          grep -q "from './photo-board-editor-session.js'" src/js/photos/photo-board-editor.js || { echo "board editor does not use session module"; exit 1; }
          grep -q "export function createEmptyBoardEditorSession" src/js/photos/photo-board-editor-session.js || { echo "board editor session API missing"; exit 1; }
          grep -q "export function pushBoardEditorHistory" src/js/photos/photo-board-editor-session.js || { echo "board editor history API missing"; exit 1; }
          grep -q "export function applyBoardEditorHistory" src/js/photos/photo-board-editor-session.js || { echo "board editor history restore API missing"; exit 1; }
          grep -q "export function settleBoardEditorEntry" src/js/photos/photo-board-editor-session.js || { echo "board editor settle API missing"; exit 1; }
          if grep -q "function createEmptySession_\|function sameDraft_\|function clone(value)" src/js/photos/photo-board-editor.js; then
            echo "board editor still owns session primitives"
            exit 1
          fi

          # 写真DOMイベントをcontrollerから分離
          test -f src/js/photos/photo-interactions.js
          grep -q "from './photo-interactions.js'" src/js/photos/photo-controller.js || { echo "photo controller does not use interactions module"; exit 1; }
          grep -q "export function bindPhotoInteractions" src/js/photos/photo-interactions.js || { echo "photo interactions API missing"; exit 1; }
          grep -q "openPhotoViewer" src/js/photos/photo-interactions.js || { echo "photo viewer interaction missing"; exit 1; }
          grep -q "openCamera" src/js/photos/photo-interactions.js || { echo "photo camera interaction missing"; exit 1; }
          if grep -q "function bindEvents\|function bindPhotoTabExitReset\|data-photo-camera-visual\|data-photo-picker" src/js/photos/photo-controller.js; then
            echo "photo controller still owns DOM interactions"
            exit 1
          fi

          # 写真Record操作をcontrollerから分離
          test -f src/js/photos/photo-record-actions.js
          grep -q "from './photo-record-actions.js'" src/js/photos/photo-controller.js || { echo "photo controller does not use record actions"; exit 1; }
          grep -q "export async function importPickedPhotoFiles" src/js/photos/photo-record-actions.js || { echo "photo import action missing"; exit 1; }
          grep -q "export async function registerCapturedPhoto" src/js/photos/photo-record-actions.js || { echo "photo capture action missing"; exit 1; }
          grep -q "export async function deletePhotos" src/js/photos/photo-record-actions.js || { echo "photo delete action missing"; exit 1; }
          grep -q "export async function setRepresentativePhoto" src/js/photos/photo-record-actions.js || { echo "photo representative action missing"; exit 1; }
          if grep -q "function nextPhotoId\|PHOTO_COMMON_CREATE_EDIT_FIELDS\|saveCapturedPhoto\|updateCameraPhotoRecord\|touchFieldEditedAt\|persistPhotoForProject\|openPhotoBoardEditorSequence" src/js/photos/photo-controller.js; then
            echo "photo controller still owns record actions"
            exit 1
          fi

          # 写真サムネイル/プレビュー管理をcontrollerから分離
          test -f src/js/photos/photo-preview-manager.js
          grep -q "from './photo-preview-manager.js'" src/js/photos/photo-controller.js || { echo "photo controller does not use preview manager"; exit 1; }
          grep -q "export function setLocalPhotoPreview" src/js/photos/photo-preview-manager.js || { echo "photo preview local API missing"; exit 1; }
          grep -q "export function hydrateThumbnailImages" src/js/photos/photo-preview-manager.js || { echo "photo preview hydrate API missing"; exit 1; }
          grep -q "export async function hydrateCurrentPhotoPreviews" src/js/photos/photo-preview-manager.js || { echo "photo preview restore API missing"; exit 1; }
          grep -q "export function resetPhotoPreviewManager" src/js/photos/photo-preview-manager.js || { echo "photo preview reset API missing"; exit 1; }
          if grep -q "localPreviewUrls\|remoteThumbnailUrls\|remoteThumbnailFetches\|previewSessionId\|function demoPreviewSource\|function previewSourceForPhoto\|function revokePreviewUrl\|function hydrateThumbnailImages" src/js/photos/photo-controller.js; then
            echo "photo controller still owns preview management"
            exit 1
          fi

          # PhotoViewer用データ組立をcontrollerから分離
          test -f src/js/photos/photo-viewer-data.js
          grep -q "from './photo-viewer-data.js'" src/js/photos/photo-controller.js || { echo "photo controller does not use viewer data module"; exit 1; }
          grep -q "export function photosForViewer" src/js/photos/photo-viewer-data.js || { echo "photo viewer photo-set API missing"; exit 1; }
          grep -q "export function compareTargetsForViewer" src/js/photos/photo-viewer-data.js || { echo "photo viewer compare-target API missing"; exit 1; }
          grep -q "photoRecordStore.get(photoId)" src/js/photos/photo-viewer-data.js || { echo "photo viewer data does not resolve photo from store"; exit 1; }
          if grep -q "photoById(" src/js/photos/photo-viewer-data.js; then
            echo "photo viewer data still depends on controller-local lookup"
            exit 1
          fi
          if grep -q "function photosForViewer\|function compareTargetsForViewer" src/js/photos/photo-controller.js; then
            echo "photo controller still owns viewer data assembly"
            exit 1
          fi

          # 仕上表DOMイベントをcontrollerから分離
          test -f src/js/finish-table/finish-table-interactions.js
          grep -q "bindFinishTableInteractions" src/js/finish-table/finish-table-controller.js || { echo "finish interactions are not bound"; exit 1; }
          grep -q "export function bindFinishTableInteractions" src/js/finish-table/finish-table-interactions.js || { echo "finish interactions API missing"; exit 1; }
          if grep -q "function bindEvents\|PEN_DRAG_THRESHOLD_PX" src/js/finish-table/finish-table-controller.js; then
            echo "finish controller still owns DOM interaction wiring"
            exit 1
          fi

          # 建材リスト分析結果／備考
          grep -q "analysisResult: String(record.analysisResult || '')" src/js/materials/material-list-view-model.js || { echo "material list analysisResult mapping missing"; exit 1; }
          grep -q "remarks: String(record.remarks || '')" src/js/materials/material-list-view-model.js || { echo "material list remarks mapping missing"; exit 1; }
          grep -q "toggle-material-analysis-columns" src/js/materials/material-list-controller.js || { echo "material analysis column toggle missing"; exit 1; }
          grep -q "data-editor-kind=.*analysisResult\|renderTextDisplay(row, 'analysisResult'" src/js/materials/material-list-renderer.js || { echo "material analysis result editor missing"; exit 1; }
          grep -q "renderTextDisplay(row, 'remarks'" src/js/materials/material-list-renderer.js || { echo "material analysis remarks editor missing"; exit 1; }

          # 分析結果取込は「無 / 石綿含有」のみを結果へ保持し、その他は分析備考へ送る
          grep -q "function normalizeAnalysisResult" src/js/analysis/analysis-import-controller.js || { echo "analysis result normalization missing"; exit 1; }
          grep -q "analysisResult = '石綿含有'" src/js/analysis/analysis-import-controller.js || { echo "asbestos-containing result mapping missing"; exit 1; }
          grep -q "analysisResult = '無'" src/js/analysis/analysis-import-controller.js || { echo "none result mapping missing"; exit 1; }

          # 出力帳票の調査備考は material.note のみ
          grep -q "note:text(record.note)" src/js/output/output-view-model.js || { echo "material output note source is not survey note"; exit 1; }
          grep -q "note:material?text(material.note):''" src/js/output/output-view-model.js || { echo "room output note source is not survey note"; exit 1; }

          # 報告書用の分析区分・結果を現場区分から変換
          grep -q "function reportAnalysisFields" src/js/output/output-view-model.js || { echo "report analysis mapping missing"; exit 1; }
          grep -q "sourceRequired==='みなし'.*analysisRequired:'目視'.*analysisResult:'石綿含有みなし'" src/js/output/output-view-model.js || { echo "assumed asbestos mapping missing"; exit 1; }
          grep -q "sourceRequired==='対象外'.*analysisRequired:'目視'.*analysisResult:'調査対象外'" src/js/output/output-view-model.js || { echo "out-of-scope mapping missing"; exit 1; }
          grep -q "sourceRequired==='目視'.*analysisResult:sourceResult||'-'" src/js/output/output-view-model.js || { echo "visual report fallback missing"; exit 1; }
          grep -q "analysisRequired:'採取・分析'.*analysisResult:sourceResult||'-'" src/js/output/output-view-model.js || { echo "sampling report fallback missing"; exit 1; }
          grep -q "cell.col===8.*drawSingleLineFit" src/js/output/output-pdf-renderer.js || { echo "room analysis result single-line fit missing"; exit 1; }

          # 表示文字とは別に元の分析結果から陽性色を保持
          grep -q "function sourceResultIsPositive" src/js/output/output-view-model.js || { echo "source positive mapping missing"; exit 1; }
          grep -q "sourceRequired==='みなし'.*positive:true" src/js/output/output-view-model.js || { echo "assumed asbestos must be positive"; exit 1; }
          grep -q "sourceRequired==='対象外'.*positive:sourcePositive" src/js/output/output-view-model.js || { echo "out-of-scope positive source mapping missing"; exit 1; }
          grep -q "positive:reportAnalysis.positive" src/js/output/output-view-model.js || { echo "report positive flag missing"; exit 1; }
          grep -q "row.positive??isPositive" src/js/output/output-pdf-renderer.js || { echo "PDF does not use report positive flag"; exit 1; }
          if sed -n '/function wrapRoomNoLines/,/^}/p' src/js/output/output-pdf-renderer.js | grep -q "setFont(pdf"; then
            echo "wrapRoomNoLines must not reset text color"
            exit 1
          fi
          grep -q "positive: isMaterialPositive(record)" src/js/materials/material-list-view-model.js || { echo "material list positive mapping missing"; exit 1; }
          grep -q "positive-material-row" src/js/materials/material-list-renderer.js || { echo "material list positive row class missing"; exit 1; }
          grep -q "positive-material-row" src/css/material-list.css || { echo "material list positive red style missing"; exit 1; }
          grep -q "if(r.positive)row.font" src/js/output/output-export-controller.js || { echo "Excel material positive row color missing"; exit 1; }
          # 部屋別リストは陽性行の部屋No.・部屋名・部屋備考も含めて赤表示
          grep -q "roomRows.some.*RED:BLACK" src/js/output/output-pdf-renderer.js || { echo "room group positive color mapping missing"; exit 1; }
          grep -q "roomNo.*color:roomColor" src/js/output/output-pdf-renderer.js || { echo "room number does not follow positive row color"; exit 1; }
          grep -q "roomName.*color:roomColor" src/js/output/output-pdf-renderer.js || { echo "room name does not follow positive row color"; exit 1; }
          grep -q "roomNote.*color:roomColor" src/js/output/output-pdf-renderer.js || { echo "room note does not follow positive row color"; exit 1; }
          grep -q "row.floor.*color:BLACK" src/js/output/output-pdf-renderer.js || { echo "room floor color rule changed"; exit 1; }
          if grep -q "remarks||record.note\|remarks||material.note" src/js/output/output-view-model.js; then
            echo "analysis remarks are still mixed into survey note output"
            exit 1
          fi

          test -f src/js/output/output-pdf-preview.js
          test -f src/js/output/output-format.js
          test -f src/js/output/output-targets.js
          grep -q "OutputPdfPreview" src/js/output/output-pdf-preview-controller.js
          grep -q "formatSamplingCode" src/js/output/output-pdf-renderer.js
          grep -q "formatSamplingCode" src/js/output/output-export-controller.js
          grep -q "MATERIAL_WIDTHS.*6,33,12,42,6,19,19,53" src/js/output/output-pdf-renderer.js
          grep -q "ROOM_WIDTHS.*10,12,22,12,6,38,35,6,19,30" src/js/output/output-pdf-renderer.js

          if grep -R "output-report-renderer\|output-photo-layout" -n src; then
            echo "obsolete HTML output path remains"
            exit 1
          fi
          if test -e src/js/debug/h-log.js; then
            echo "legacy h-log.js remains"
            exit 1
          fi
          if test -e .firebase/hosting..cache; then
            echo "generated Firebase cache is tracked"
            exit 1
          fi

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ODAKO_CHOUSA_SYSTEM_PWA }}
          projectId: odako-chousa-system-pwa
          channelId: v0163a
