name: Deploy v0.1.9.3 Formal Candidate

on:
  push:
    branches:
      - work/v0.1.9.3-20261006

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src/js src/config -type f -name '*.js' -print0)
          node --check src/service-worker.js

      - name: Module and app shell reference checks
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const roots = ['src/js', 'src/config'];
          const files = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes:true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile() && entry.name.endsWith('.js')) files.push(full);
            }
          }
          roots.forEach(walk);
          const missing = [];
          const re = /(?:from\s*|import\s*\()\s*['"](\.[^'"]+)['"]/g;
          for (const file of files) {
            const text = fs.readFileSync(file, 'utf8');
            let match;
            while ((match = re.exec(text))) {
              const resolved = path.resolve(path.dirname(file), match[1]);
              const candidates = [resolved, `${resolved}.js`, path.join(resolved, 'index.js')];
              if (!candidates.some((candidate) => fs.existsSync(candidate))) missing.push(`${file} -> ${match[1]}`);
            }
          }
          if (missing.length) {
            console.error('Missing relative module references:\n' + missing.join('\n'));
            process.exit(1);
          }

          const sw = fs.readFileSync('src/service-worker.js', 'utf8');
          const shell = [...sw.matchAll(/['"]\.\/([^'"]+)['"]/g)].map((m) => m[1]);
          const missingShell = shell.filter((rel) => rel && !fs.existsSync(path.join('src', rel)));
          if (missingShell.length) {
            console.error('Missing APP_SHELL files:\n' + missingShell.join('\n'));
            process.exit(1);
          }

          const shellSet = new Set(shell.map((rel) => './' + rel));
          const jsShellMissing = files
            .filter((file) => file.startsWith('src/js/'))
            .map((file) => './' + file.replace(/^src\//, ''))
            .filter((rel) => !shellSet.has(rel));
          if (jsShellMissing.length) {
            console.error('Local JS modules missing from APP_SHELL:\n' + jsShellMissing.join('\n'));
            process.exit(1);
          }
          NODE

      - name: Output formatting regression checks
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { formatSamplingCode, formatPartDisplay } from './src/js/output/output-format.js';
          const assert = (condition, message) => { if (!condition) throw new Error(message); };
          assert(formatSamplingCode({ projectNo:'260701014', sampleNo:'1', branch:1 }) === '260701014-1 1', 'sampling code format changed');
          assert(formatPartDisplay('壁、床').split === false, 'short two-part label should remain one line');
          const split = formatPartDisplay('壁、天井');
          assert(split.split === true && split.lines.join('|') === '壁|天井', 'long multi-part label should split at delimiter');
          assert(formatPartDisplay('ハト小屋').split === false, 'single long part should stay one line');
          NODE


      - name: M-03 variable room restoration checks
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { restoreFinishRecordsFromSparse, getRequiredStructureRecordIds } from './src/js/sync/finish-sparse-structure.js';
          import { computeCellPosition, buildFloorRoomPosition } from './src/js/records/finish-record.js';

          const marker = (areaCode, floor, index) => {
            const roomPosition = areaCode === 'I' || areaCode === 'B'
              ? buildFloorRoomPosition(floor, index)
              : String(index).padStart(3, '0');
            return {
              finishId: `${areaCode}-${roomPosition}-${computeCellPosition(6, 2)}`,
              areaCode,
              roomPosition,
              floor,
              roomNo: areaCode === 'B' ? `B${floor}-${index}` : `${floor}-${index}`,
              roomName: '',
              roomNote: '',
              position: computeCellPosition(6, 2),
              part: '',
              materialId: '',
              materialName: '',
              inputId: '',
              status: 'active',
              fieldEditedAt: {}
            };
          };

          const roomsInFloor = (records, areaCode, floor) =>
            new Set(records
              .filter((record) => record.areaCode === areaCode && Number(record.floor) === Number(floor))
              .map((record) => record.roomPosition)).size;

          let restored = restoreFinishRecordsFromSparse([marker('I', 4, 3)]);
          if (roomsInFloor(restored, 'I', 4) !== 3) throw new Error('added 3-room floor did not restore as 3 rooms');

          restored = restoreFinishRecordsFromSparse([marker('B', 1, 4)]);
          if (roomsInFloor(restored, 'B', 1) !== 4) throw new Error('4-room basement floor did not restore as 4 rooms');

          restored = restoreFinishRecordsFromSparse([marker('I', 1, 11)]);
          if (roomsInFloor(restored, 'I', 1) !== 11) throw new Error('default floor extended to 11 rooms did not restore as 11 rooms');

          restored = restoreFinishRecordsFromSparse([marker('I', 4, 3), marker('I', 5, 7)]);
          const required = getRequiredStructureRecordIds(restored);
          if (!required.has(marker('I', 4, 3).finishId)) throw new Error('floor 4 tip marker is not retained');
          if (!required.has(marker('I', 5, 7).finishId)) throw new Error('floor 5 tip marker is not retained');
          NODE

      - name: M-04 field conflict merge checks
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { mergeRecordByFieldEditedAt } from './src/js/sync/record-field-merge.js';

          const local = {
            materialId:'R001',
            name:'端末Aの名称',
            note:'旧備考',
            fieldEditedAt:{ name:200, note:100 }
          };
          const incoming = {
            materialId:'R001',
            name:'旧名称',
            note:'端末Bの備考',
            fieldEditedAt:{ name:100, note:300 }
          };
          let result = mergeRecordByFieldEditedAt('material', local, incoming);
          if (result.record.name !== '端末Aの名称') throw new Error('newer local field was lost');
          if (result.record.note !== '端末Bの備考') throw new Error('newer incoming field was lost');

          result = mergeRecordByFieldEditedAt(
            'material',
            { materialId:'R001', note:'local', fieldEditedAt:{note:100} },
            { materialId:'R001', note:'remote', fieldEditedAt:{note:200} }
          );
          if (result.record.note !== 'remote') throw new Error('newer incoming same-field edit did not win');

          result = mergeRecordByFieldEditedAt(
            'material',
            { materialId:'R001', note:'local', fieldEditedAt:{note:200} },
            { materialId:'R001', note:'remote', fieldEditedAt:{note:200} },
            { prefer:'local' }
          );
          if (result.record.note !== 'local') throw new Error('unsent tie did not prefer local');

          result = mergeRecordByFieldEditedAt(
            'material',
            { materialId:'R001', note:'legacy-local', fieldEditedAt:{} },
            { materialId:'R001', note:'legacy-remote', fieldEditedAt:{} }
          );
          if (result.record.note !== 'legacy-remote') throw new Error('legacy tie should prefer incoming');

          result = mergeRecordByFieldEditedAt(
            'photo',
            { photoId:'P001', photoType:'visual', part:'壁', fieldEditedAt:{} },
            { photoId:'P001', photoType:'visual', fileName:'a.jpg', fieldEditedAt:{} }
          );
          if (result.record.part !== '壁') throw new Error('field absent from remote schema erased local-only value');
          NODE

      - name: M-05 room carrier and other cells checks
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { restoreFinishRecordsFromSparse } from './src/js/sync/finish-sparse-structure.js';
          import { computeCellPosition, buildFloorRoomPosition } from './src/js/records/finish-record.js';

          const roomPosition = buildFloorRoomPosition(1, 1);
          const nonCarrier = {
            finishId:`I-${roomPosition}-${computeCellPosition(1,1)}`,
            areaCode:'I',
            roomPosition,
            floor:1,
            roomNo:'1-1',
            roomName:'古い部屋名',
            roomNote:'古い備考',
            position:computeCellPosition(1,1),
            part:'床',
            materialId:'',
            materialName:''
          };
          let restored = restoreFinishRecordsFromSparse([nonCarrier]);
          const room = restored.filter((r)=>r.areaCode==='I' && r.roomPosition===roomPosition);
          if (room.some((r)=>r.roomName==='古い部屋名')) throw new Error('non-602 roomName resurrected');
          if (room.some((r)=>r.roomNote==='古い備考')) throw new Error('non-602 roomNote resurrected');

          const carrier = {
            finishId:`I-${roomPosition}-${computeCellPosition(6,2)}`,
            areaCode:'I',
            roomPosition,
            floor:1,
            roomNo:'101',
            roomName:'機械室',
            roomNote:'確認済み',
            position:computeCellPosition(6,2),
            part:'',
            materialId:'',
            materialName:''
          };
          restored = restoreFinishRecordsFromSparse([carrier]);
          const room2 = restored.filter((r)=>r.areaCode==='I' && r.roomPosition===roomPosition);
          if (!room2.length || room2.some((r)=>r.roomNo!=='101' || r.roomName!=='機械室' || r.roomNote!=='確認済み')) {
            throw new Error('602 room common fields did not expand to whole room');
          }
          NODE

          grep -q "return !materialName && !actualPart" src/js/finish-table/finish-table-persistence.js || { echo "other part/materialName independent sparse keep missing"; exit 1; }
          grep -q "partPatchForExistingMaterial(currentCell, partIndex, material)" src/js/finish-table/finish-table-cell-actions.js || { echo "name-selection other part autofill missing"; exit 1; }

      - name: M-06 project metadata and board settings checks
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const storage = new Map();
          globalThis.localStorage = {
            getItem(key) { return storage.has(key) ? storage.get(key) : null; },
            setItem(key, value) { storage.set(key, String(value)); },
            removeItem(key) { storage.delete(key); }
          };

          const board = await import('./src/js/settings/board-settings-store.js');

          localStorage.setItem('chousa-board-settings:P1', JSON.stringify({
            projectNo:'OLD',
            projectName:'旧案件名',
            address:'旧住所',
            surveyDate:'2026-01-01',
            surveyor:'旧調査者',
            subjectText:'旧看板案件名',
            addressText:'旧看板住所',
            subjectFontSize:12,
            addressFontSize:11
          }));

          board.activateProject({
            projectId:'P1',
            projectNo:'260001',
            projectName:'Firestore案件名',
            address:'Firestore住所',
            boardSettings:{
              surveyDate:'2026-10-05',
              surveyor:'Firestore調査者',
              subjectText:'Firestore看板案件名',
              addressText:'Firestore看板住所',
              subjectFontSize:22,
              addressFontSize:21
            }
          });
          let current = board.get();
          if (current.projectNo !== '260001' || current.projectName !== 'Firestore案件名' || current.address !== 'Firestore住所') {
            throw new Error('Firestore project fields did not override legacy local cache');
          }
          if (current.surveyDate !== '2026-10-05' || current.surveyor !== 'Firestore調査者') {
            throw new Error('Firestore board settings did not override legacy local cache');
          }
          if (current.subjectText !== 'Firestore看板案件名' || current.addressText !== 'Firestore看板住所') {
            throw new Error('Firestore board text did not override legacy local cache');
          }

          localStorage.setItem('chousa-board-settings:P2', JSON.stringify({
            projectNo:'P2',
            projectName:'旧案件',
            address:'旧住所',
            surveyDate:'2026-09-01',
            surveyor:'移行対象調査者',
            subjectText:'移行対象看板名',
            addressText:'移行対象住所',
            subjectFontSize:19,
            addressFontSize:18
          }));
          board.activateProject({
            projectId:'P2',
            projectNo:'P2',
            projectName:'案件名',
            address:'住所'
          });
          current = board.get();
          if (current.surveyor !== '移行対象調査者' || current.subjectText !== '移行対象看板名') {
            throw new Error('legacy local board settings were not preserved for migration');
          }
          NODE

          grep -q "boardSettings: normalizeBoardSettings" src/js/firestore/firestore-repository.js || { echo "Firestore project metadata does not save boardSettings"; exit 1; }
          grep -q "export async function readProjectMetadata" src/js/firestore/firestore-repository.js || { echo "project metadata read API missing"; exit 1; }
          grep -q "export function subscribeProjectMetadata" src/js/firestore/firestore-repository.js || { echo "project metadata realtime API missing"; exit 1; }
          grep -q "readProjectMetadataForProject" src/js/projects/project-controller.js || { echo "project metadata initial read missing"; exit 1; }
          grep -q "subscribeProjectMetadataForProject" src/js/projects/project-controller.js || { echo "project metadata realtime subscription missing"; exit 1; }
          grep -q "PROJECT_METADATA_BOARD_MIGRATED" src/js/projects/project-controller.js || { echo "legacy board migration missing"; exit 1; }
          grep -q "updateProjectFields(currentProject.projectId" src/js/settings/settings-controller.js || { echo "settings projectStore update missing"; exit 1; }
          grep -q "persistProjectMetadataForProject(snapshot)" src/js/settings/settings-controller.js || { echo "settings Firestore metadata save missing"; exit 1; }
          grep -q "applyProjectMetadata" src/js/settings/board-settings-store.js || { echo "board settings realtime apply missing"; exit 1; }
          grep -q "String(item.projectId || '') === projectInfo.projectNo" src/js/projects/onedrive-project-browser.js || { echo "OneDrive stable projectId matching missing"; exit 1; }

      - name: M-07 offline project and recovery checks
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createTemporaryProject, nextTemporaryProjectNo } from './src/js/projects/project-factory.js';

          const project = createTemporaryProject({
            projectName:'圏外案件',
            address:'神奈川県',
            deviceCode:'AB12',
            existingProjects:[],
            existingProjectNos:[]
          });
          if (project.projectId === project.projectNo) throw new Error('temporary projectId still equals projectNo');
          if (!project.projectId.startsWith('tmp-') || !project.projectId.includes('-AB12-')) {
            throw new Error('temporary projectId is not device-scoped');
          }
          if (!/^\d{6}-\d+$/.test(project.projectNo)) throw new Error('temporary display projectNo format changed');

          const nextNo = nextTemporaryProjectNo(
            '261006',
            [{ projectNo:'261006-01' }, { projectNo:'261006-02' }],
            ['261006-03']
          );
          if (nextNo !== '261006-04') throw new Error('temporary project number allocation changed');

          const storage = new Map();
          globalThis.localStorage = {
            getItem(key) { return storage.has(key) ? storage.get(key) : null; },
            setItem(key, value) { storage.set(key, String(value)); },
            removeItem(key) { storage.delete(key); }
          };
          const unsent = await import('./src/js/sync/unsent-queue.js');
          unsent.putUnsent({
            projectId:'tmp-test',
            recordType:'project',
            recordId:'tmp-test',
            operation:'set',
            record:{ projectId:'tmp-test', projectName:'初回' },
            meta:{ initializeChangeLog:true }
          });
          unsent.putUnsent({
            projectId:'tmp-test',
            recordType:'project',
            recordId:'tmp-test',
            operation:'set',
            record:{ projectId:'tmp-test', projectName:'更新後' },
            meta:{ initializeChangeLog:false }
          });
          const queued = unsent.listUnsent({ projectId:'tmp-test' });
          if (queued.length !== 1) throw new Error('project UNSENT was not compressed to latest one');
          if (queued[0].record?.projectName !== '更新後') throw new Error('project UNSENT did not keep latest record');
          if (queued[0].meta?.initializeChangeLog !== true) throw new Error('project initialization flag was lost');

          const controller = fs.readFileSync('./src/js/projects/project-controller.js','utf8');
          const projectRecovery = controller.indexOf('PROJECT_UNSENT_RECOVERY_RESULT');
          const catchup = controller.indexOf("SYNC_CATCHUP_START");
          const recordRecovery = controller.indexOf('RECORD_UNSENT_RECOVERY_RESULT');
          const listener = controller.indexOf("SYNC_LISTENER_START");
          if (!(projectRecovery >= 0 && catchup > projectRecovery && recordRecovery > catchup && listener > recordRecovery)) {
            throw new Error('M-07 recovery order is not project -> remote merge -> record retry -> realtime');
          }
          NODE

          grep -q "recordType === 'project'" src/js/firestore/firestore-repository.js || { echo "project UNSENT repository handling missing"; exit 1; }
          grep -q "project-write-does-not-passive-retry-records" src/js/firestore/firestore-repository.js || { echo "project write may retry records before M-04 merge"; exit 1; }
          grep -q "readTemporaryProjectEntries" src/js/firestore/firestore-repository.js || { echo "temporary project ownership lookup missing"; exit 1; }
          grep -q "syncQueuedProjectMetadataOnRecovery" src/js/sync/project-record-persistence.js || { echo "project metadata recovery sync missing"; exit 1; }
          grep -q "syncQueuedRecordsOnRecovery" src/js/sync/project-record-persistence.js || { echo "record recovery sync missing"; exit 1; }
          grep -q "excludeRecordTypes: \['project'\]" src/js/sync/project-record-persistence.js || { echo "record recovery does not exclude project entries"; exit 1; }
          grep -q "PROJECT_METADATA_MISSING_RECREATED" src/js/projects/project-controller.js || { echo "v0.1.9.30 offline project migration missing"; exit 1; }
          grep -q "TEMP_PROJECT_NO_REASSIGNED" src/js/projects/project-controller.js || { echo "temporary project number collision recovery missing"; exit 1; }
          grep -q "new Set(\['project', 'finish', 'material', 'photo'\])" src/js/projects/project-transfer.js || { echo "project pending write missing from offline JSON transfer"; exit 1; }
          grep -q "meta: item.meta || {}" src/js/projects/project-transfer.js || { echo "project queue metadata missing from offline JSON import"; exit 1; }

      - name: M-08 server-clock change log retention checks
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {
            buildChangeLogRetentionState,
            canDeleteChangeLogCursor,
            compareFinishCursors
          } from './src/js/sync/change-log-retention.js';

          const DAY = 24 * 60 * 60 * 1000;
          const serverNow = 1_800_000_000_000;
          const ts = (ms) => ({
            seconds: Math.floor(ms / 1000),
            nanoseconds: (ms % 1000) * 1_000_000
          });
          const cursor = (seconds, id) => ({ seconds, nanoseconds:0, changeId:id });

          const state = buildChangeLogRetentionState([
            { deviceCode:'A', lastSeenAt:ts(serverNow), finishChangeCursor:cursor(200,'B') },
            { deviceCode:'B', lastSeenAt:ts(serverNow - 10 * DAY), finishChangeCursor:cursor(150,'A') },
            { deviceCode:'OLD', lastSeenAt:ts(serverNow - 40 * DAY), finishChangeCursor:cursor(50,'Z') }
          ], 30 * DAY);

          if (state.serverNowMs !== serverNow) throw new Error('serverNow did not come from syncDevices lastSeenAt');
          if (state.activeDevices.length !== 2) throw new Error('dormant device was not excluded');
          if (state.oldestActiveCursor?.seconds !== 150 || state.oldestActiveCursor?.changeId !== 'A') {
            throw new Error('oldest active device cursor was not selected');
          }
          if (!canDeleteChangeLogCursor(cursor(149,'Z'), state.oldestActiveCursor)) {
            throw new Error('change before oldest active cursor should be deletable');
          }
          if (canDeleteChangeLogCursor(cursor(150,'A'), state.oldestActiveCursor)) {
            throw new Error('oldest active cursor document itself must remain');
          }
          if (canDeleteChangeLogCursor(cursor(151,'A'), state.oldestActiveCursor)) {
            throw new Error('change after oldest active cursor must remain');
          }
          if (compareFinishCursors(cursor(100,'A'), cursor(100,'B')) >= 0) {
            throw new Error('cursor changeId tiebreak ordering changed');
          }

          const persistence = fs.readFileSync('./src/js/sync/project-record-persistence.js','utf8');
          const freshFnStart = persistence.indexOf('export function isFinishChangeCursorFresh');
          const freshFnEnd = persistence.indexOf('/**', freshFnStart + 10);
          const freshFn = persistence.slice(freshFnStart, freshFnEnd);
          if (freshFn.includes('Date.now()')) {
            throw new Error('adapter cursor freshness still depends on client Date.now');
          }

          const repository = fs.readFileSync('./src/js/firestore/firestore-repository.js','utf8');
          if (/expiresAt\s*:/.test(repository)) {
            throw new Error('client-derived expiresAt write remains in Firestore repository');
          }
          const cursorFnStart = repository.indexOf('export async function isFinishChangeCursorAvailable');
          const cursorFnEnd = repository.indexOf('/**', cursorFnStart + 10);
          const cursorFn = repository.slice(cursorFnStart, cursorFnEnd);
          if (cursorFn.includes('Date.now()')) {
            throw new Error('cursor availability still depends on client Date.now');
          }

          const controller = fs.readFileSync('./src/js/projects/project-controller.js','utf8');
          const touch = controller.indexOf('await recordProjectSyncDeviceContact');
          const cleanup = controller.indexOf('await cleanupProjectFinishChangeLogIfDue');
          if (!(touch >= 0 && cleanup > touch)) {
            throw new Error('change log cleanup is not sequenced after device touch');
          }
          NODE

          test -f src/js/sync/change-log-retention.js
          grep -q "buildChangeLogRetentionState" src/js/firestore/firestore-repository.js || { echo "server-clock retention state missing"; exit 1; }
          grep -q "SYNC_DEVICE_COLLECTION" src/js/firestore/firestore-repository.js || { echo "syncDevices cleanup read missing"; exit 1; }
          grep -q "where('committedAt', '<=', Timestamp.fromMillis(retentionCutoffMs))" src/js/firestore/firestore-repository.js || { echo "committedAt retention query missing"; exit 1; }
          grep -q "canDeleteChangeLogCursor" src/js/firestore/firestore-repository.js || { echo "active cursor protection missing"; exit 1; }
          grep -q "CHANGELOG_CLEANUP_SKIP_NO_SERVER_TIME" src/js/firestore/firestore-repository.js || { echo "safe skip without server time missing"; exit 1; }
          grep -q "change-log-retention.js" src/service-worker.js || { echo "M-08 retention helper missing from app shell"; exit 1; }

      - name: M-09 visual photo roomNo and part checks
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createPhotoRecord } from './src/js/records/photo-record.js';
          import { serializePhotoRecord } from './src/js/firestore/record-serializer.js';
          import { resolveVisualPhotoMetadata } from './src/js/sync/photo-visual-metadata.js';
          import { mergeRecordByFieldEditedAt } from './src/js/sync/record-field-merge.js';

          const visual = createPhotoRecord({
            photoId:'P001',
            photoType:'visual',
            areaCode:'I',
            roomPosition:'001001',
            partSlot:3,
            roomNo:'101',
            part:'壁'
          });
          const payload = serializePhotoRecord(visual, { updatedAt:null });
          if (payload.roomNo !== '101' || payload.part !== '壁') {
            throw new Error('visual roomNo / part are not serialized to Firestore payload');
          }

          const legacy = createPhotoRecord({
            photoId:'P002',
            photoType:'visual',
            areaCode:'I',
            roomPosition:'001001',
            partSlot:3,
            roomNo:'',
            part:'',
            fieldEditedAt:{}
          });
          const finish = [{
            finishId:'I-001001-301',
            status:'active',
            areaCode:'I',
            roomPosition:'001001',
            roomNo:'101',
            position:301,
            part:'壁'
          }];
          const migrated = resolveVisualPhotoMetadata(legacy, finish);
          if (migrated.record.roomNo !== '101' || migrated.record.part !== '壁') {
            throw new Error('legacy visual photo metadata was not backfilled from finish');
          }
          if (!migrated.changedFields.includes('roomNo') || !migrated.changedFields.includes('part')) {
            throw new Error('backfilled fields were not reported');
          }
          if (!(migrated.record.fieldEditedAt?.roomNo > 0) || !(migrated.record.fieldEditedAt?.part > 0)) {
            throw new Error('backfilled roomNo / part were not stamped in fieldEditedAt');
          }

          const preserved = resolveVisualPhotoMetadata(createPhotoRecord({
            ...legacy,
            photoId:'P003',
            roomNo:'撮影時101',
            part:'撮影時壁'
          }), [{
            ...finish[0],
            roomNo:'現在102',
            part:'現在天井'
          }]);
          if (preserved.record.roomNo !== '撮影時101' || preserved.record.part !== '撮影時壁') {
            throw new Error('existing visual metadata was overwritten by finish fallback');
          }
          if (preserved.changedFields.length !== 0) {
            throw new Error('existing visual metadata should not be marked migrated');
          }

