          const migrate = controller.indexOf('await migrateLegacyVisualPhotoMetadata(project)');
          const retry = controller.indexOf('await syncQueuedRecordsOnRecovery(project)');
          if (!(migrate >= 0 && retry > migrate)) {
            throw new Error('legacy photo migration must run after remote merge and before queued record retry');
          }
